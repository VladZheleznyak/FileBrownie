services:
  tooling:
    profiles: [dev]
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12.12-slim
        RUN pip install --no-cache-dir uv==0.8.22
        ENV UV_PYTHON_DOWNLOADS=never
        WORKDIR /workspace
    working_dir: /workspace
    volumes:
      - .:/workspace
    networks: [setup]
    logging:
      driver: none
