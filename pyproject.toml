[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "filebrownie"
version = "0.1.0"
description = "Local evidence-backed medical histories (Phase 1 scaffold)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "PyMuPDF>=1.25,<2",
    "Pillow>=11,<13",
]

[project.scripts]
filebrownie = "filebrownie.presentation.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = "/tmp/pytest-cache"
markers = ["integration: requires the disposable Compose test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
