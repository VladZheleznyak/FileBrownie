services:
  app:
    environment:
      FILEBROWNIE_TEST_DATABASE_URL: postgresql://filebrownie@db-test/filebrownie_test
    depends_on:
      db-test:
        condition: service_healthy
    volumes: !override
      - models:/models:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /sources:size=64m,mode=1777
      - /data:size=256m,mode=1777

  db-test:
    profiles: [test]
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: filebrownie_test
      POSTGRES_USER: filebrownie
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_messages=panic
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - logging_collector=off
    tmpfs: ["/var/lib/postgresql/data:size=256m"]
    networks: [processing]
    logging:
      driver: none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filebrownie -d filebrownie_test"]
      interval: 1s
      timeout: 5s
      retries: 30
